<div class="panel text-center py-5">
  <i class="bi bi-{{ icon|default:'inbox' }} fs-1 text-secondary"></i>
  <h6 class="fw-bold mt-2">{{ title }}</h6>
  <p class="text-muted small mx-auto mb-3" style="max-width:520px">{{ text }}</p>

</div>

{% include "portfolio/_theme.html" %}
<style>
  .pf .role { border-radius: 20px; padding: 1px 9px; font-size: .72rem; font-weight: 600; white-space: nowrap; border: 1px solid; }
  .pf .role-viewer { background: #f8fafc; color: #475569; border-color: #e2e8f0; }
  .pf .role-tester { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .pf .role-developer { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .pf .role-lead { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .pf .role-project-admin { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .pf .list-group-item.active { background: var(--pf-soft); border-color: var(--pf-border); color: var(--pf-dark); font-weight: 600; }

  </div>
  <div class="view-toggle ms-auto">
    <a href="{% url 'org_home' %}" class="{% if org_tab == 'employees' %}active{% endif %}"><i class="bi bi-people"></i> Employees</a>
